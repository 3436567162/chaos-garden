[package]
name = "contributor-rank"
version = "0.1.0"
description = "Configurable open-source contributor ranking desktop app"
authors = ["ContributorRank"]
edition = "2021"

[lib]
name = "contributor_rank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["sync", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
