[package]
name = "chronoscope"
version = "0.1.0"
description = "Git code archaeology: scrub through a repository's history as a 3D city"
edition = "2021"

[lib]
name = "chronoscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21.0", default-features = false }

[profile.dev.package."*"]
opt-level = 2
