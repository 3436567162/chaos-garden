[package]
name = "redquill"
version = "0.1.0"
description = "LLM-driven jailbreak probe: template library, genetic mutation, dual-channel judging"
edition = "2021"

[lib]
name = "redquill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Loopback stub server + pipeline drivers used by the integration tests. Off by
# default so none of it reaches a release binary.
test-support = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "net", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.8"

[profile.dev.package."*"]
opt-level = 2

[[test]]
name = "e2e"
required-features = ["test-support"]
